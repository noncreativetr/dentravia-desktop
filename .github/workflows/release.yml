name: Windows installer
# Every push to main builds the Windows installer (32 and 64 bit in one file) and publishes it as the GitHub release
# of the version in package.json (v1.2.0, …); a version already released is left as it is. Installed programs find the
# new release there and update themselves. So: raise "version" in package.json to release.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      # RustDesk for remote support: the official release files, checked against fixed SHA-256 fingerprints.
      - name: Fetch RustDesk 1.5.1
        shell: bash
        run: |
          mkdir -p vendor/rustdesk
          fetch() { curl -fsSL -o "vendor/rustdesk/$2" "https://github.com/rustdesk/rustdesk/releases/download/1.5.1/$1"; echo "$3  vendor/rustdesk/$2" | sha256sum -c -; }
          fetch rustdesk-1.5.1-x86_64.exe rustdesk-x64.exe 319206042390ebfcba934cf0baa2f612f34de463c78c843b7cb8c22097c4bf7b
          fetch rustdesk-1.5.1-x86-sciter.exe rustdesk-x86.exe fbc9d8f59602bf6b1b419902cd8c77cd236393e6fe74635393e8a9cf4c765483
          curl -fsSL -o vendor/rustdesk/LICENSE.txt https://raw.githubusercontent.com/rustdesk/rustdesk/1.5.1/LICENCE
      # The release needs its tag (v + package.json version); created here once, on the commit being built.
      - name: Tag this version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "$version already tagged"
          else
            git tag "$version" && git push origin "$version"
          fi
      # The release is created here, once, before the build uploads to it: when the build created it, its parallel
      # uploads sometimes each tried to create it and the second failed, leaving a release without latest.yml.
      - name: Create the release of this version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          gh release view "$version" >/dev/null 2>&1 || gh release create "$version" --title "${version#v}" --notes "Dentravia ${version#v}" --verify-tag
      - name: Build and publish the release of this version
        run: npx electron-builder --win nsis --x64 --ia32 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Dentravia-Kurulum
          path: dist/Dentravia-Kurulum-*.exe
          retention-days: 14
